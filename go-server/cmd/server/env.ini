# 이 파일을 env.ini 로 복사해서 사용
[REST]
IP=
PORT=8088
CORS=localhost:3000,localhost:3001,localhost:3002
TLS=0
SSLCERT=./crt/test.crt
SSLKEY=./crt/test.key

[SPA]
DIR=build
INDEX=index.html

; 화면에서 수정한 엔드포인트 설정을 저장할 파일. 없으면 build/config/endpoints.json 을 기본값으로 쓴다.
[ENDPOINTS]
FILE=./data/endpoints.json

[LOG]
LEVEL=INFO

; 0: TEST ( 비정상 종료 시 exit 1 ), 1: PRODUCT ( 비정상 종료 시 재시작 )
[DEPLOY_SATE]
MODE=1
