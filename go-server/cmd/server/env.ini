# 이 파일을 env.ini 로 복사해서 사용
[REST]
IP=
PORT=8088
CORS=localhost:3000,localhost:3001,localhost:3002
TLS=0
SSLCERT=./crt/test.crt
SSLKEY=./crt/test.key

[SPA]
DIR=build
INDEX=index.html

; 화면 ⚙ 설정에서 저장하는 그룹 · 서버 · 프로세스 설정 ( SSH 비밀번호가 들어 있으므로 0600 으로 저장 )
; KNOWN_HOSTS: 접속한 서버의 SSH 호스트 키 기록. 서버를 재설치해 키가 바뀌면 해당 줄을 지운다.
[PROCESSES]
FILE=./data/processes.json
KNOWN_HOSTS=./data/known_hosts

[LOG]
LEVEL=INFO

; 0: TEST ( 비정상 종료 시 exit 1 ), 1: PRODUCT ( 비정상 종료 시 재시작 )
[DEPLOY_SATE]
MODE=1
