; Debug GUI - 모니터링 대상 API 목록
;
; 규칙:
;   - 섹션 하나 = 엔드포인트 하나 (섹션 이름은 고유해야 함)
;   - url 은 필수. 항상 GET 요청으로 호출되며, 응답 JSON 전체가 그대로 표시됩니다.
;     (특정 필드만 가져오는 API가 아니라, 객체의 모든 정보를 반환하는 API를 등록하세요)
;   - label 은 화면에 표시될 이름 (생략 시 섹션 이름 사용)
;   - poll_interval_ms 는 섹션별 폴링 주기 (생략 시 [global] 기본값 사용)
;
; 이 파일은 빌드 없이 새로고침만으로 반영됩니다 (public/ 아래 정적 파일로 서빙됨).
; 각 백엔드가 브라우저에서 직접 호출되므로, 브라우저 Origin에 대한 CORS 허용이 필요합니다.

[global]
poll_interval_ms=3000

[order-engine]
label=Smart Shelter Station State
url=http://yj-shelter.com:8082/stationstt
poll_interval_ms=1000

[risk-manager]
label=Risk Manager
url=http://localhost:8082/debug/state

[market-data-feed]
label=Market Data Feed
url=http://localhost:8083/debug/state
poll_interval_ms=500
